<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал регистрации (Сессии)</title>
    <link rel="stylesheet" href="static/css/main.css">
</head>
<body>
    <div class="main-layout">
        <aside id="sidebar">
            </aside>

        <div class="content-wrapper">
            <header>
                <div class="title-section">
                    <h1>Журнал регистрации</h1>
                    <p id="page-subtitle"></p>
                </div>
                <div class="search-section">
                     <input type="search" id="search-box" placeholder="Поиск по всем полям...">
                </div>
                <div id="status-container">
                    <span id="status-indicator"></span>
                    <span id="status-text">Подключение...</span>
                </div>
            </header>

            <div class="table-header-sticky">
                <table class="log-table log-table--header">
                    <colgroup>
                        <col style="width: 25%;">
                        <col style="width: 25%;">
                        <col style="width: 20%;">
                        <col style="width: 30%;">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>Регистрация</th>
                            <th>Дерегистрация</th>
                            <th>Активность</th>
                            <th>ТСД</th>
                        </tr>
                    </thead>
                </table>
            </div>
            
            <main id="main-content">
                <table class="log-table log-table--body">
                    <colgroup>
                        <col style="width: 25%;">
                        <col style="width: 25%;">
                        <col style="width: 20%;">
                        <col style="width: 30%;">
                    </colgroup>
                    <tbody id="log-body"></tbody>
                </table>
            </main>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="static/js/shared.js"></script>
    <script src="static/js/script.js"></script>
</body>
</html>
